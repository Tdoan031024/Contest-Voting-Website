name: Deploy to iNET

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build artifacts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PRIVATE_DISABLE_SOURCEMAPS: 1
          NEXT_DISABLE_ESLINT: 1
        run: |
          npm run prisma:generate --workspace=apps/api
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/api
          npm run build --workspace=apps/web
          npm run build --workspace=apps/admin

      - name: Package build artifacts
        run: |
          tar -czf deploy-artifacts.tgz \
            apps/api/dist \
            packages/shared/dist \
            apps/web/.next \
            apps/admin/.next

      - name: Upload build artifacts to hosting
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTING_HOST }}
          username: ${{ secrets.HOSTING_USER }}
          key: ${{ secrets.HOSTING_SSH_KEY }}
          port: ${{ secrets.HOSTING_PORT }}
          source: deploy-artifacts.tgz
          target: /tmp

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTING_HOST }}
          username: ${{ secrets.HOSTING_USER }}
          key: ${{ secrets.HOSTING_SSH_KEY }}
          port: ${{ secrets.HOSTING_PORT }}
          script: |
            set -e

            PROJECT_DIR=/home/uqqwmiabhosting/public_html/startup.huitmedia.edu.vn
            NODE_ENV_PATH=/home/uqqwmiabhosting/nodevenv/public_html/startup.huitmedia.edu.vn/apps/web/22/bin/activate

            source "$NODE_ENV_PATH"
            unset NPM_CONFIG_PREFIX
            unset npm_config_prefix
            unset NPM_CONFIG_PRODUCTION
            unset npm_config_production
            export NODE_OPTIONS="--max-old-space-size=450"
            export NEXT_TELEMETRY_DISABLED=1
            export NEXT_PRIVATE_DISABLE_SOURCEMAPS=1
            export NEXT_DISABLE_ESLINT=1
            LOG_DIR=/tmp/huit-deploy-logs
            ARTIFACT_PATH=/tmp/deploy-artifacts.tgz
            mkdir -p "$LOG_DIR"

            # Stop services to free up RAM before building
            echo "[deploy] Stopping services to free up memory..."
            cloudlinux-selector stop --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/admin || true
            cloudlinux-selector stop --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/api || true
            cloudlinux-selector stop --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/web || true

            cd "$PROJECT_DIR"
            echo "[deploy] Fetch latest main"
            git remote set-branches origin main
            git fetch --prune --depth=1 origin main
            git reset --hard FETCH_HEAD

            echo "[deploy] Install dependencies"
            if ! env -u NODE_ENV -u NPM_CONFIG_PRODUCTION -u npm_config_production -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" ci --include=dev --no-audit --no-fund > "$LOG_DIR/npm-ci.log" 2>&1; then
              tail -n 200 "$LOG_DIR/npm-ci.log"
              exit 1
            fi
            tail -n 20 "$LOG_DIR/npm-ci.log"
            
            echo "[deploy] Prisma generate"
            if ! env -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" run prisma:generate --workspace=apps/api > "$LOG_DIR/prisma-generate.log" 2>&1; then
              tail -n 200 "$LOG_DIR/prisma-generate.log"
              exit 1
            fi
            tail -n 20 "$LOG_DIR/prisma-generate.log"

            echo "[deploy] Extract prebuilt artifacts"
            if [ ! -f "$ARTIFACT_PATH" ]; then
              echo "Missing artifact: $ARTIFACT_PATH"
              exit 1
            fi
            tar -xzf "$ARTIFACT_PATH" -C "$PROJECT_DIR"
            rm -f "$ARTIFACT_PATH"

            echo "[deploy] Starting services..."
            cloudlinux-selector start --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/admin || cloudlinux-selector restart --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/admin
            cloudlinux-selector start --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/api || cloudlinux-selector restart --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/api
            cloudlinux-selector start --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/web || cloudlinux-selector restart --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/web
