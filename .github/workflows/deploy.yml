name: Deploy to iNET

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTING_HOST }}
          username: ${{ secrets.HOSTING_USER }}
          key: ${{ secrets.HOSTING_SSH_KEY }}
          port: ${{ secrets.HOSTING_PORT }}
          script: |
            set -e

            PROJECT_DIR=/home/uqqwmiabhosting/public_html/startup.huitmedia.edu.vn
            NODE_ENV_PATH=/home/uqqwmiabhosting/nodevenv/public_html/startup.huitmedia.edu.vn/apps/web/22/bin/activate

            source "$NODE_ENV_PATH"
            unset NPM_CONFIG_PREFIX
            unset npm_config_prefix
            unset NPM_CONFIG_PRODUCTION
            unset npm_config_production
            export NODE_OPTIONS=--max_old_space_size=1536
            export NEXT_TELEMETRY_DISABLED=1
            export NEXT_PRIVATE_DISABLE_SOURCEMAPS=1
            export NEXT_DISABLE_ESLINT=1

            cd "$PROJECT_DIR"
            echo "[deploy] Fetch latest main"
            git fetch --all
            git reset --hard origin/main

            echo "[deploy] Install dependencies"
            env -u NODE_ENV -u NPM_CONFIG_PRODUCTION -u npm_config_production -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" ci --include=dev --no-audit --no-fund
            echo "[deploy] Build shared"
            env -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" run build --workspace=packages/shared
            echo "[deploy] Build api"
            env -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" run build --workspace=apps/api
            echo "[deploy] Build web"
            env -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" run build --workspace=apps/web
            echo "[deploy] Build admin"
            env -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" run build --workspace=apps/admin
            echo "[deploy] Prisma generate"
            env -u NPM_CONFIG_PREFIX -u npm_config_prefix npm --prefix "$PROJECT_DIR" run prisma:generate --workspace=apps/api

            echo "[deploy] Restart services"
            cloudlinux-selector restart --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/admin
            cloudlinux-selector restart --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/api
            cloudlinux-selector restart --json --interpreter nodejs --app-root public_html/startup.huitmedia.edu.vn/apps/web
